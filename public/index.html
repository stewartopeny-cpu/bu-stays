<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#c99712">
  <meta name="description" content="Find and compare student hostels near Busitema University.">
  <title>Busitema Stays</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="/logo-mark.svg" alt=""><span>Busitema Stays</span></a>
    <nav><button class="link-button" id="profileBtn">Student details</button><a href="/manager.html">Manager</a></nav>
  </header>

  <main>
    <section class="search-panel">
      <div>
        <p class="eyebrow">HOSTELS NEAR BUSITEMA UNIVERSITY</p>
        <h1>Find a room that fits your life and budget.</h1>
      </div>
      <div class="search-grid">
        <label class="search-box">Search hostel or location<input id="search" type="search" placeholder="Try Precious, Syaule…" autocomplete="off" aria-autocomplete="list" aria-controls="searchSuggestions"><span id="searchSuggestions" class="search-suggestions" role="listbox" hidden></span></label>
        <label>Maximum price<select id="price"><option value="">Any price</option><option value="400000">Up to UGX 400k</option><option value="500000">Up to UGX 500k</option><option value="700000">Up to UGX 700k</option><option value="1000000">Up to UGX 1m</option><option value="1500000">Up to UGX 1.5m</option></select></label>
        <label>Room type<select id="type"><option value="">Any type</option><option>Single</option><option>Self-contained</option><option>Sharing</option></select></label>
      </div>
      <div class="service-filter" aria-label="Included services">
        <span>Included services:</span>
        <label><input type="checkbox" value="Water"> Water</label>
        <label><input type="checkbox" value="Electricity"> Electricity</label>
        <label><input type="checkbox" value="Wi-Fi"> Wi-Fi</label>
        <label><input type="checkbox" value="Security"> Security</label>
      </div>
    </section>

    <section class="results-head"><div><h2>Available hostels</h2><p id="resultCount"></p></div><button id="clearFilters" class="secondary">Clear filters</button></section>
    <section id="hostels" class="hostel-grid" aria-live="polite"></section>
    <div id="empty" class="empty" hidden><h2>No exact match</h2><p>Try increasing the price or selecting fewer services.</p></div>
  </main>

  <dialog id="profileDialog">
    <form method="dialog" id="profileForm" class="dialog-form">
      <button class="dialog-close" type="button" data-close-dialog aria-label="Close">×</button>
      <p class="eyebrow">YOUR DETAILS</p><h2>Save time when booking</h2>
      <label>Full name<input name="fullName" required></label>
      <label>Phone number<input name="phone" type="tel" required></label>
      <label>Email address<input name="email" type="email"></label>
      <button class="primary" value="default">Save details</button>
    </form>
  </dialog>

  <dialog id="bookingDialog">
    <form method="dialog" id="bookingForm" class="dialog-form">
      <button class="dialog-close" type="button" data-close-dialog aria-label="Close">×</button>
      <p class="eyebrow">ROOM REQUEST</p><h2 id="bookingTitle">Request a room</h2>
      <input name="hostelName" type="hidden">
      <label>Full name<input name="fullName" required></label>
      <label>Phone number<input name="phone" type="tel" required></label>
      <label>Email address<input name="email" type="email"></label>
      <label>Room type<select name="roomType" required><option value="">Choose room type</option><option>Single</option><option>Self-contained</option><option>Sharing</option></select></label>
      <label>Gender<select name="gender"><option>Not specified</option><option>Male</option><option>Female</option></select></label>
      <label>Move-in date<input name="moveInDate" type="date"></label>
      <label>Message<textarea name="message" rows="3" placeholder="Anything the manager should know?"></textarea></label>
      <p id="bookingMessage" class="form-message"></p>
      <div class="dialog-actions"><button type="button" class="secondary cancel-dialog">Continue browsing</button><button class="primary" value="default">Send room request</button></div>
    </form>
  </dialog>
  <script src="/data.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
